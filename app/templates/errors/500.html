{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="fs-1">⚠️</div>
  <h2 class="fw-bold mt-2">500</h2>
  <p class="text-muted">Ocurrió un error inesperado en el servidor.</p>
  <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-brand">Volver al inicio</a>
</div>
{% endblock %}
